  <path d="M 118 114 C 112 134 100 150 92 172" stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M 122 114 C 128 134 138 148 132 172" stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none"/>
